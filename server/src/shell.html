<!DOCTYPE html>
<!--
  平台构建外壳 —— 每个作品编译时由 emcc --shell-file 使用。
  提供一个全屏画布, SDL2 端口会自动使用 id="canvas" 的元素。
  {{{ SCRIPT }}} 是 emcc 的占位符, 会被替换为作品的实际 JavaScript。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C++ 作品</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0b0e14; overflow: hidden; }
    #container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    canvas { max-width: 100%; max-height: 100%; display: block; background: #000; }
  </style>
</head>
<body>
  <div id="container">
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
  </div>
  <script>
    // 把画布交给 Emscripten 模块
    var Module = { canvas: document.getElementById('canvas') };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
